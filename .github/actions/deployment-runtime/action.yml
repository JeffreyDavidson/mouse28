name: Deployment smoke runtime
description: Install locked dependencies for the HTTP deployment smoke suite.
inputs:
    composer-username:
        required: true
        description: Private Composer repository username
    composer-password:
        required: true
        description: Private Composer repository password
    composer-auth:
        required: true
        description: Composer auth JSON with read access to the private creator-kit package
runs:
    using: composite
    steps:
        - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
          with:
              php-version: '8.5'
              extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
              coverage: none
        - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
          with:
              node-version: '22'
        - name: Install PHP dependencies
          shell: bash
          env:
              COMPOSER_USERNAME: ${{ inputs.composer-username }}
              COMPOSER_PASSWORD: ${{ inputs.composer-password }}
              COMPOSER_AUTH: ${{ inputs.composer-auth }}
          run: |
              composer config --global --auth http-basic.satis.filamentexamples.com "$COMPOSER_USERNAME" "$COMPOSER_PASSWORD"
              composer install --no-interaction --prefer-dist --no-progress
