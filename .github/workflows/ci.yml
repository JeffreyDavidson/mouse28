name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, gd, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Validate PHP dependencies
        run: composer validate --strict --no-check-publish

      - name: Configure private Composer repository
        env:
          FILAMENTEXAMPLES_COMPOSER_USERNAME: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          FILAMENTEXAMPLES_COMPOSER_PASSWORD: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
        run: composer config --global --auth http-basic.satis.filamentexamples.com "$FILAMENTEXAMPLES_COMPOSER_USERNAME" "$FILAMENTEXAMPLES_COMPOSER_PASSWORD"

      - name: Locate Composer cache
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --format=plain

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Test benchmark calculations, route discovery, and failure handling
        run: node --test tests/Browser/navigation-timings.test.mjs tests/Browser/benchmark-failures.test.mjs tests/Browser/cloudflare-access-headers.test.mjs tests/Browser/benchmark-page-discovery.test.mjs

      - name: Check PHP and Blade formatting
        run: composer test:lint

      - name: Check Filament code
        run: composer test:filacheck

      - name: Run static analysis
        run: composer analyse

      - name: Check automated refactoring
        run: composer test:rector

      - name: Check Pest automated refactoring
        run: composer test:rector:pest

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run Pest static analysis
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          CACHE_STORE: array
          MAIL_MAILER: array
        run: composer analyse:pest

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          CACHE_STORE: array
          MAIL_MAILER: array
        run: composer test

      - name: Enforce application type coverage
        run: composer test:type-coverage

      - name: Build assets
        run: npm run build

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Link public storage
        run: php artisan storage:link --no-interaction

      - name: Run focused browser regressions
        run: composer test:browser:smoke

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-regression-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Test and build
    runs-on: ubuntu-latest
    needs: [application, mysql]
    if: always()
    timeout-minutes: 1
    steps:
      - name: Require application and MySQL checks
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          MYSQL_RESULT: ${{ needs.mysql.result }}
        run: test "$APPLICATION_RESULT" = success && test "$MYSQL_RESULT" = success

  mutation-shards:
    name: Mutation (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [commands, delivery, views, content, integrations]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, gd, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: pcov

      - name: Configure private Composer repository
        env:
          FILAMENTEXAMPLES_COMPOSER_USERNAME: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          FILAMENTEXAMPLES_COMPOSER_PASSWORD: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
        run: composer config --global --auth http-basic.satis.filamentexamples.com "$FILAMENTEXAMPLES_COMPOSER_USERNAME" "$FILAMENTEXAMPLES_COMPOSER_PASSWORD"

      - name: Locate Composer cache
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run mutation tests
        run: time composer test:mutate:${{ matrix.group }}

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: mutation-shards
    if: always()
    timeout-minutes: 1
    steps:
      - name: Require every mutation group to pass
        env:
          MUTATION_RESULT: ${{ needs.mutation-shards.result }}
        run: test "$MUTATION_RESULT" = success

  mysql:
    name: MySQL compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-root
          MYSQL_DATABASE: mouse28_test
          MYSQL_USER: mouse28_test
          MYSQL_PASSWORD: mouse28_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, gd, libxml, mbstring, zip, pcntl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Configure private Composer repository
        env:
          FILAMENTEXAMPLES_COMPOSER_USERNAME: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          FILAMENTEXAMPLES_COMPOSER_PASSWORD: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
        run: composer config --global --auth http-basic.satis.filamentexamples.com "$FILAMENTEXAMPLES_COMPOSER_USERNAME" "$FILAMENTEXAMPLES_COMPOSER_PASSWORD"
      - name: Locate Composer cache
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check migrations and database-sensitive workflows
        run: composer test:mysql
