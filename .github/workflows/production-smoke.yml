name: Production smoke

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/deployment-runtime
        with:
          composer-username: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          composer-password: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
          composer-auth: ${{ secrets.COMPOSER_AUTH }}

      - name: Run bounded production smoke tests
        env:
          PRODUCTION_BASE_URL: https://mouse28.com
        run: |
          # The smoke tests boot the test app, which reads .env. An empty file avoids a
          # missing-file warning; configuration still comes from phpunit.xml and this step.
          touch .env
          vendor/bin/pest tests/Feature/Http/ProductionSmokeTest.php --group=production --compact --display-warnings --display-deprecations
